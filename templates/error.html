<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sound - {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px;">

        <p>{{ mensaje }}</p>
        <p><a href="{{ url_for('dashboard') if usuario else url_for('index') }}" style="color:#c77dff;font-weight:700;">Volver al inicio</a></p>
    </main>
</body>
</html>
